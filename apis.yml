name: Appionics
description: Appionics Holdings Limited is a Hong Kong mobile applications and games company that
  operated under the consumer brand name "Animoca". Co-founded by Yat Siu and David Kim, and emerging
  out of the Outblaze group, Appionics developed and published cross-platform games and apps for iOS
  and Android, claiming more than 150 titles and over 40 million downloads during 2011. In 2014 the
  company spun off part of its app portfolio, along with a set of licensed intellectual-property game
  rights, into Animoca Brands Corporation Limited (ASX AB1), which listed on the Australian Securities
  Exchange in January 2015 and later pivoted to blockchain gaming and NFTs. Appionics itself never
  published a developer program, and today has no live web or API surface of its own.
