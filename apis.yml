x-enrichment-note: 'Enrichment 2026-07-19 (round 2): re-verified — Appionics has no live web or API
  surface. appionics.eu is NXDOMAIN; appionics.com and appionics.net both resolve to the same parking
  IPs (3.33.130.190 / 15.197.148.33) and return HTTP 200 serving only a redirect stub to /lander, i.e.
  a parked/for-sale domain with no content. No GitHub org (github.com/appionics HTTP 404), no npm
  packages (registry search total 0), no PyPI package (pypi.org/pypi/appionics/json HTTP 404), no
  developer portal, OpenAPI, or SDKs. No artifacts could be produced without fabrication, so none
  were. IDENTITY CORRECTION to the 2026-07-18 note: that round removed a Website pointer to
  animocabrands.com and recorded Animoca Brands as "an unrelated company" — that is not accurate.
  Animoca Brands Corporation Limited (ASX AB1) was spun out of Appionics Holdings Limited in 2014,
  and "Animoca" was Appionics own consumer brand name. Removing the pointer was still the right call
  (Animoca Brands is a separate, currently-listed company and animocabrands.com is not Appionics own
  site), but the corporate relationship is genuine and is recorded here so a future round does not
  re-flag it as a harvesting error. Sources: Crunchbase (Appionics Holdings Limited), Wikipedia
  (Animoca Brands), outblaze.com/animoca-brands, gamesauce.biz/tag/appionics.'
